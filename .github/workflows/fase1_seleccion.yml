name: Fase 1 - Seleccion de partidos

# Local (UTC-5):
#   - Reintenta cada 5 min entre las 05:00 y las 05:55 (seleccion original del dia).
#   - Segunda revision, cada 5 min entre las 19:00 y las 19:55, por si se
#     subieron cambios a la hoja durante el dia. Corre con --forzar.
on:
  schedule:
    - cron: "*/5 10 * * *"     # 10:00-10:55 UTC = 05:00-05:55 local (seleccion de la manana)
    - cron: "*/5 0 * * *"      # 00:00-00:55 UTC = 19:00-19:55 local (revision de la noche, forzada)
  workflow_dispatch:
    inputs:
      forzar:
        description: "Forzar la revision (fusiona, ignora si ya se completo hoy)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  seleccionar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Ejecutar seleccion de partidos
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          echo "Siempre forzado -- se fusiona con lo ya seleccionado."
          python seleccionar_partidos.py --forzar

      - name: Guardar cambios en data/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/
          git diff --staged --quiet || git commit -m "Fase 1: seleccion de partidos $(date -u +%Y-%m-%d)"
          git push
