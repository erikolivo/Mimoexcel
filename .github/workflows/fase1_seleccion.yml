name: Fase 1 - Seleccion de partidos

# Local (UTC-5):
#   - RESPALDO del disparo principal 06:45 que hace el loop de Fase 3
#     (chain 24 h). Reintentos a las 06:45, 06:50 y 06:55.
#   - Segunda revision, cada 5 min entre las 19:00 y las 19:55, por si se
#     subieron cambios a la hoja durante el dia. Corre con --forzar.
#     (El arranque de cada job de Fase 3 tambien re-fusiona la seleccion.)
on:
  schedule:
    - cron: "45,50,55 11 * * *"   # 11:45-11:55 UTC = 06:45-06:55 local (respaldo manana)
    - cron: "*/5 0 * * *"      # 00:00-00:55 UTC = 19:00-19:55 local (revision de la noche, forzada)
  workflow_dispatch:
    inputs:
      forzar:
        description: "Forzar la revision (fusiona, ignora si ya se completo hoy)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  seleccionar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Ejecutar seleccion de partidos
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          echo "Siempre forzado -- se fusiona con lo ya seleccionado."
          python seleccionar_partidos.py --forzar

      - name: Guardar cambios en data/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/
          git diff --staged --quiet && exit 0
          git commit -m "Fase 1: seleccion de partidos $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "[AVISO] push rechazado, intento $i/5 -- reintentando con rebase..."
            git pull --rebase
            sleep 3
          done
          echo "[ERROR] no se pudo pushear tras 5 intentos."
          exit 1
