name: Reporte diario (8:30am)

# Local (UTC-5): 08:30 y 08:45.
on:
  schedule:
    - cron: "30,45 13 * * *"   # 13:30-13:45 UTC = 08:30-08:45 local
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  reportar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Enviar reporte de ayer (Hoja2)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python reporte_diario.py
