name: Watchdog Fase 3

# Verifica cada 30 min que Fase 3 esté corriendo correctamente.
# Si el heartbeat (.fase3_heartbeat) tiene más de 10 min de antigüedad
# y hay partidos en vivo, re-dispara Fase 3.
on:
  schedule:
    - cron: "15,45 * * * *"   # Cada 30 min en :15 y :45
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Verificar heartbeat y re-disparar Fase 3 si es necesario
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python -c "
          import subprocess, time
          from pathlib import Path

          partidos = Path('data/partidos_hoy.json')
          heartbeat = Path('data/.fase3_heartbeat')

          if not partidos.exists():
              print('No hay partidos_hoy.json — nada que vigilar.')
              exit(0)

          if not heartbeat.exists():
              print('No hay heartbeat — Fase 3 nunca corrió hoy. Re-disparando...')
              exit(1)

          # OJO: en un checkout fresco el mtime del archivo es la hora
          # del checkout, NO sirve. Se usa la hora del ultimo commit que
          # toco el heartbeat (Fase 3 pushea cada ciclo, ~5 min).
          try:
              ts = int(subprocess.check_output(
                  ['git', 'log', '-1', '--format=%ct', '--', 'data/.fase3_heartbeat'],
                  text=True).strip())
          except Exception as e:
              print(f'Heartbeat sin commits — re-disparando... ({e})')
              exit(1)

          antiguedad = time.time() - ts
          print(f'Heartbeat hace {antiguedad/60:.1f} min.')

          if antiguedad > 1500:  # 25 min sin push = colgado o muerto
              print('Heartbeat stale (>25 min) — re-disparando Fase 3...')
              print('(concurrency del workflow cancela el run colgado si aun existe)')
              exit(1)

          print('Fase 3 OK.')
          "

      - name: Re-disparar Fase 3
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run fase3_vigilancia.yml
