name: Fase 2 - Resumen diario

# Local (UTC-5): reintenta entre las 05:31 y las 05:45.
on:
  schedule:
    - cron: "31,35,40,45 10 * * *"   # 10:31-10:45 UTC = 05:31-05:45 local
  workflow_dispatch:
    inputs:
      forzar:
        description: "Forzar el reenvio (ignora si ya se hizo hoy)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  resumen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Enviar resumen del dia
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event.inputs.forzar }}" = "true" ]; then
            echo "Reenvio forzado del resumen."
            python resumen.py --forzar
          else
            python resumen.py
          fi

      - name: Guardar cambios en data/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/
          git diff --staged --quiet || git commit -m "Fase 2: resumen enviado $(date -u +%Y-%m-%d)"
          git push
